name: Native artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify native host architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected host architecture ' + process.arch)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: --target ${{ matrix.target }} -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: Verify Windows binary and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = 'target\x86_64-pc-windows-msvc\release\journal-logger.exe'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $binary))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) {
            throw 'Expected an x64 Windows executable'
          }
          $installers = @(Get-ChildItem 'target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
      - name: Verify and archive the macOS application
        if: runner.os == 'macOS'
        run: |
          test "$(lipo -archs 'target/aarch64-apple-darwin/release/bundle/macos/Journal Logger.app/Contents/MacOS/journal-logger')" = arm64
          test -n "$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          tar -czf target/aarch64-apple-darwin/release/Journal-Logger.app.tar.gz -C target/aarch64-apple-darwin/release/bundle/macos 'Journal Logger.app'
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-logger-windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-logger-macos-apple-silicon
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/Journal-Logger.app.tar.gz
          if-no-files-found: error
